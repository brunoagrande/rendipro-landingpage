  <!-- Meta Pixel — stub síncrono (eventos vão pra queue antes da lib chegar).
       O fetch do fbevents.js (~100KB, async) é disparado no DOMContentLoaded
       em vez de window.load: DCL acontece logo após o HTML ser parsed (~1-2s
       em 4G), bem antes do load (que espera imagens/fontes — 5-10s em 4G).
       Antes (defer pra load), ~40% dos PageView se perdiam: usuário saía
       antes do load disparar e a queue do fbq nunca era despachada. Como
       a tag é async, não bloqueia o LCP. -->
  <script>
    (function (f) {
      if (f.fbq) return;
      var n = f.fbq = function () {
        n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n;
      n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
    })(window);
    fbq('init', '963747769968663');
    fbq('track', 'PageView');
    function loadFbEventsLib() {
      var t = document.createElement('script');
      t.async = true;
      t.src = 'https://connect.facebook.net/en_US/fbevents.js';
      var s = document.getElementsByTagName('script')[0];
      s.parentNode.insertBefore(t, s);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadFbEventsLib);
    } else {
      loadFbEventsLib();
    }
  </script>
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=963747769968663&ev=PageView&noscript=1"
  /></noscript>

  <!-- Meta CAPI: captura fbclid no carregamento inicial e persiste em localStorage (90 dias).
       Necessário porque o usuário pode navegar pela landing antes de clicar no CTA,
       perdendo o fbclid da URL original. O React lê este valor em getCheckoutUrl(). -->
  <script>
    (function () {
      try {
        var fbclid = new URLSearchParams(window.location.search).get('fbclid');
        if (fbclid) {
          localStorage.setItem('rp_landing_fbclid', JSON.stringify({
            value: fbclid,
            expiresAt: Date.now() + 90 * 24 * 60 * 60 * 1000
          }));
        }
      } catch (_) {}
    })();
  </script>

  <!-- Microsoft Clarity — deferido até o load para não bloquear o LCP -->
  <script>
    window.addEventListener('load', function () {
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "wv890k0bjg");
    });
  </script>

  <!-- GA4 — stub SÍNCRONO no head (define window.gtag que enfileira em
       dataLayer). A lib gtag/js carrega no <body> via load event (não bloqueia
       LCP); quando ela chega, consome o dataLayer e processa tudo que foi
       enfileirado antes. Sem esse stub, todos os section_view/cta_click que
       disparam ANTES do load eram silenciosamente perdidos. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', 'G-XCS1ES8VZY');
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Google Analytics 4 — fetch da lib gtag/js deferido pra window.load (não
       bloqueia LCP). O stub window.gtag e config('G-...') estão no <head>, então
       eventos disparados antes do load são enfileirados em dataLayer e
       processados quando a lib chega. -->
  <script>
    window.addEventListener('load', function () {
      var s = document.createElement('script');
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-XCS1ES8VZY';
      s.async = true;
      document.head.appendChild(s);
    });
  </script>
</body>
