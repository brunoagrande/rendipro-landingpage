<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- RendiPro Design System Gradient (Emerald/Teal) -->
    <linearGradient id="rendipro-gradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/> <!-- Emerald-500 -->
      <stop offset="100%" stop-color="#06B6D4"/> <!-- Cyan-500 -->
    </linearGradient>
    
    <!-- Subtle Glow for the arrow -->
    <filter id="evolution-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#10B981" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Open Book Shape -->
  <path d="M24 38V12M24 12C20 9 12 9 8 12V35C12 32 20 32 24 35M24 12C28 9 36 9 40 12V35C36 32 28 32 24 35" 
        stroke="url(#rendipro-gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Content Lines (Page details) -->
  <path d="M12 16H18M12 21H18M12 26H16M30 16H36M30 21H36M32 26H36" 
        stroke="url(#rendipro-gradient)" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Evolution Arrow (Rising from the book) -->
  <path d="M24 32C24 32 26 24 34 18M34 18V24M34 18H28" 
        stroke="url(#rendipro-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#evolution-glow)"/>
  
  <!-- Accent Dot (Premium touch) -->
  <circle cx="34" cy="18" r="2" fill="url(#rendipro-gradient)" opacity="0.8"/>
</svg>
